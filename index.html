<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morphing Visage Animal Direct</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #111;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 640px;
            height: 480px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Effet miroir */
        }

        video {
            display: none;
        }

        #controls {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        button {
            padding: 10px 18px;
            font-size: 15px;
            cursor: pointer;
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.2s;
        }

        button:hover {
            background-color: #d35400;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 22px;
            color: #f1c40f;
            z-index: 20;
            font-weight: bold;
            background: rgba(0,0,0,0.8);
            padding: 20px 30px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div id="loading">Chargement des modèles IA... Veuillez patienter</div>
    
    <div class="container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" width="640" height="480"></canvas>
        
        <div id="controls">
            <button onclick="setAnimal('cat')">Chat</button>
            <button onclick="setAnimal('dog')">Chien</button>
            <button onclick="setAnimal('tiger')">Tigre</button>
            <button onclick="setAnimal('fox')">Renard</button>
        </div>
    </div>

    <!-- Dépendances TensorFlow.js & Face Landmarks Detection (Runtime MediaPipe Stable) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.10.0/dist/tf-core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.10.0/dist/tf-converter.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.10.0/dist/tf-backend-webgl.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection@1.0.5/dist/face-landmarks-detection.min.js"></script>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const loadingEl = document.getElementById('loading');

        let detector = null;
        let currentAnimal = 'cat';
        let animalTexture = null;

        const animalTextures = {
            cat: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=600&auto=format&fit=crop&q=60',
            dog: 'https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=600&auto=format&fit=crop&q=60',
            tiger: 'https://images.unsplash.com/photo-1534188753412-3e26d1d618d6?w=600&auto=format&fit=crop&q=60',
            fox: 'https://images.unsplash.com/photo-1516769136979-bf8c994ad51f?w=600&auto=format&fit=crop&q=60'
        };

        function setAnimal(type) {
            currentAnimal = type;
            loadTexture(animalTextures[type]);
        }

        function loadTexture(url) {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => {
                animalTexture = img;
            };
            img.src = url;
        }

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480, facingMode: 'user' },
                    audio: false
                });
                video.srcObject = stream;
                return new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve();
                    };
                });
            } catch (err) {
                loadingEl.innerText = "Erreur : Accès caméra refusé ou indisponible.";
                console.error(err);
            }
        }

        async function initModel() {
            try {
                await tf.setBackend('webgl');
                await tf.ready();

                const model = faceLandmarksDetection.SupportedModels.MediaPipeFaceMesh;
                const detectorConfig = {
                    runtime: 'mediapipe',
                    solutionPath: 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh',
                    refineLandmarks: true,
                    maxFaces: 1
                };
                
                detector = await faceLandmarksDetection.createDetector(model, detectorConfig);
                loadingEl.style.display = 'none';
            } catch (err) {
                loadingEl.innerText = "Erreur de chargement des modèles IA.";
                console.error(err);
            }
        }

        function drawMorphingFace(keypoints) {
            if (!animalTexture) return;

            // Repères morphologiques clés
            const leftEye = keypoints[33];
            const rightEye = keypoints[263];
            const noseTip = keypoints[1];
            const chin = keypoints[152];
            const forehead = keypoints[10];

            if (!leftEye || !rightEye || !noseTip || !chin || !forehead) return;

            const width = Math.abs(rightEye.x - leftEye.x) * 3.4;
            const height = Math.abs(chin.y - forehead.y) * 1.35;
            const centerX = noseTip.x;
            const centerY = (noseTip.y + forehead.y) / 2;

            ctx.save();
            ctx.globalAlpha = 0.88;
            ctx.drawImage(
                animalTexture,
                centerX - width / 2,
                centerY - height / 2,
                width,
                height
            );
            ctx.restore();
        }

        async function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            if (detector) {
                try {
                    const faces = await detector.estimateFaces(video, { flipHorizontal: false });
                    if (faces && faces.length > 0) {
                        drawMorphingFace(faces[0].keypoints);
                    }
                } catch (e) {
                    // Ignore les micro-erreurs de timing des frames
                }
            }

            requestAnimationFrame(renderLoop);
        }

        async function main() {
            loadTexture(animalTextures[currentAnimal]);
            await initCamera();
            await initModel();
            renderLoop();
        }

        main();
    </script>
</body>
</html>
