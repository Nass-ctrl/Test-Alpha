<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformateur de Visage Animal</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #2c3e50;
            color: white;
            font-family: sans-serif;
        }

        video, canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 100vw;
            max-height: 100vh;
            object-fit: cover;
        }

        video {
            z-index: 1;
        }

        canvas {
            z-index: 2;
            pointer-events: none; /* Important pour interagir avec la vidéo si nécessaire */
        }

        #controls {
            position: absolute;
            bottom: 20px;
            z-index: 3;
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: #2980b9;
        }

        #loading {
            position: absolute;
            z-index: 4;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div id="loading">Chargement du modèle...</div>
    <video id="video" autoplay playsinline></video>
    <canvas id="output"></canvas>

    <div id="controls">
        <button onclick="setAnimal('cat')">Chat</button>
        <button onclick="setAnimal('dog')">Chien</button>
        <button onclick="setAnimal('tiger')">Tigre</button>
        <button onclick="setAnimal('panda')">Panda</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.2.0/dist/tf-core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.2.0/dist/tf-converter.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.2.0/dist/tf-backend-webgl.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection@1.0.2/dist/face-landmarks-detection.min.js"></script>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('output');
        const ctx = canvas.getContext('2d');
        const loadingEl = document.getElementById('loading');
        
        let model;
        let currentAnimal = 'cat'; // Animal par défaut
        let animationFrameId;

        // Charger les images des animaux
        const animalAssets = {
            cat: { src: 'https://raw.githubusercontent.com/vladocar/Face-Filter/master/assets/cat_ears.png', offsetX: 0, offsetY: -0.5, scale: 1.8 },
            dog: { src: 'https://raw.githubusercontent.com/vladocar/Face-Filter/master/assets/dog_ears.png', offsetX: 0, offsetY: -0.5, scale: 1.8 },
            tiger: { src: 'https://raw.githubusercontent.com/vladocar/Face-Filter/master/assets/tiger_ears.png', offsetX: 0, offsetY: -0.5, scale: 1.8 },
            panda: { src: 'https://raw.githubusercontent.com/vladocar/Face-Filter/master/assets/panda_ears.png', offsetX: 0, offsetY: -0.45, scale: 2.0 }
        };

        const images = {};

        async function preloadImages() {
            const promises = Object.keys(animalAssets).map(key => {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => {
                        images[key] = img;
                        resolve();
                    };
                    img.onerror = reject;
                    img.src = animalAssets[key].src;
                });
            });
            await Promise.all(promises);
        }

        function setAnimal(animal) {
            currentAnimal = animal;
        }

        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user' },
                    audio: false
                });
                video.srcObject = stream;
                return new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        resolve(video);
                    };
                });
            } catch (e) {
                console.error('Erreur caméra :', e);
                loadingEl.innerText = "Erreur d'accès à la caméra.";
                throw e;
            }
        }

        async function loadFaceModel() {
            const modelConfig = faceDetection.SupportedModels.MediaPipeFaceMesh;
            const detectorConfig = {
                runtime: 'tfjs',
                refineLandmarks: true,
                maxFaces: 1
            };
            model = await faceDetection.createDetector(modelConfig, detectorConfig);
            loadingEl.style.display = 'none';
            console.log("Modèle chargé");
        }

        function drawMesh(keypoints) {
            if (!images[currentAnimal]) return;

            // Obtenir les points de repère pour le positionnement (basé sur le modèle MediaPipe)
            const faceCenter = keypoints[168]; // Point entre les yeux
            const leftEarPoint = keypoints[234]; // Côté gauche du front
            const rightEarPoint = keypoints[454]; // Côté droit du front
            const topHeadPoint = keypoints[10]; // Haut du front

            // Calculer la largeur et l'angle de la tête
            const faceWidth = Math.abs(rightEarPoint.x - leftEarPoint.x);
            const headAngle = Math.atan2(rightEarPoint.y - leftEarPoint.y, rightEarPoint.x - leftEarPoint.x);

            // Ajuster le masque en fonction de l'animal
            const asset = animalAssets[currentAnimal];
            const imageWidth = faceWidth * asset.scale;
            const imageHeight = imageWidth * (images[currentAnimal].height / images[currentAnimal].width);

            // Positionner le masque
            const drawX = faceCenter.x;
            const drawY = faceCenter.y + (imageHeight * asset.offsetY);

            // Dessiner et faire pivoter l'image
            ctx.save();
            ctx.translate(drawX, drawY);
            ctx.rotate(headAngle);
            ctx.drawImage(images[currentAnimal], -imageWidth / 2, -imageHeight / 2, imageWidth, imageHeight);
            ctx.restore();
        }

        async function detectFaces() {
            const faces = await model.estimateFaces(video, { flipHorizontal: false });

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (faces.length > 0) {
                drawMesh(faces[0].keypoints);
            }

            animationFrameId = requestAnimationFrame(detectFaces);
        }

        async function main() {
            try {
                await setupCamera();
                video.play();
                
                // Ajuster le canvas à la taille de la vidéo une fois chargée
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                await preloadImages();
                await loadFaceModel();
                detectFaces();
            } catch (e) {
                // Gérer les erreurs silencieusement ou afficher un message
            }
        }

        // Gérer le redimensionnement de la fenêtre
        window.addEventListener('resize', () => {
             if (video.videoWidth > 0) {
                 canvas.width = video.videoWidth;
                 canvas.height = video.videoHeight;
             }
        });

        main();

    </script>
</body>
</html>
