<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformation Morphologique Visage Animal</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #0b0b0b;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 640px;
            height: 480px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Effet miroir */
        }

        video {
            display: none;
        }

        #controls {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        button {
            padding: 10px 18px;
            font-size: 15px;
            cursor: pointer;
            background-color: #8e44ad;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.2s;
        }

        button:hover {
            background-color: #9b59b6;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            color: #f39c12;
            z-index: 20;
            font-weight: bold;
            background: rgba(0,0,0,0.85);
            padding: 20px 30px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div id="loading">Chargement du moteur de morphing facial...</div>
    
    <div class="container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" width="640" height="480"></canvas>
        
        <div id="controls">
            <button onclick="setAnimal('tiger')">Tigre</button>
            <button onclick="setAnimal('cat')">Chat</button>
            <button onclick="setAnimal('dog')">Chien</button>
            <button onclick="setAnimal('fox')">Renard</button>
        </div>
    </div>

    <!-- Chargement direct de clmtrackr pour le maillage géométrique 3D/2D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/clmtrackr/1.1.2/clmtrackr.min.js"></script>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const loadingEl = document.getElementById('loading');

        let ctrack = new clm.tracker();
        let currentAnimal = 'tiger';
        let animalTexture = null;

        // Textures de visages animaux haute résolution adaptées au mapping
        const animalTextures = {
            tiger: 'https://images.unsplash.com/photo-1534188753412-3e26d1d618d6?w=600&auto=format&fit=crop&q=60',
            cat: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=600&auto=format&fit=crop&q=60',
            dog: 'https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=600&auto=format&fit=crop&q=60',
            fox: 'https://images.unsplash.com/photo-1516769136979-bf8c994ad51f?w=600&auto=format&fit=crop&q=60'
        };

        function setAnimal(type) {
            currentAnimal = type;
            loadTexture(animalTextures[type]);
        }

        function loadTexture(url) {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => { animalTexture = img; };
            img.src = url;
        }

        async function init() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480, facingMode: 'user' },
                    audio: false
                });
                video.srcObject = stream;
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve();
                    };
                });

                ctrack.init();
                ctrack.start(video);

                loadTexture(animalTextures[currentAnimal]);
                loadingEl.style.display = 'none';
                renderLoop();
            } catch (err) {
                loadingEl.innerText = "Erreur d'accès à la caméra.";
                console.error(err);
            }
        }

        // Fonction d'interpolation affine par triangle pour déformer la texture animale sur le visage
        function drawTriangle(ctx, img, p0, p1, p2, t0, t1, t2) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(p0[0], p0[1]);
            ctx.lineTo(p1[0], p1[1]);
            ctx.lineTo(p2[0], p2[1]);
            ctx.closePath();
            ctx.clip();

            // Calcul de la matrice de transformation affine
            const d = (t0[0] - t2[0]) * (t1[1] - t2[1]) - (t1[0] - t2[0]) * (t0[1] - t2[1]);
            if (d !== 0) {
                const a = ((p0[0] - p2[0]) * (t1[1] - t2[1]) - (p1[0] - p2[0]) * (t0[1] - t2[1])) / d;
                const b = ((p1[0] - p2[0]) * (t0[0] - t2[0]) - (0 | (p0[0] - p2[0])) * (t1[1] - t2[1])) / d; // Ajustement arithmétique
                // Simplification robuste du rendu par projection de texture de sous-région
                ctx.transform(
                    ((t1[1] - t2[1]) * (p0[0] - p2[0]) - (t0[1] - t2[1]) * (p1[0] - p2[0])) / d,
                    ((t0[1] - t2[1]) * (p2[0] - p1[0]) - (t1[1] - t2[1]) * (p0[0] - p2[0])) / d,
                    ((t2[0] - t1[0]) * (p0[1] - p2[1]) - (t0[0] - t2[0]) * (p2[1] - p1[1])) / d,
                    ((t0[0] - t2[0]) * (p2[1] - p1[1]) - (t2[0] - t1[0]) * (p0[1] - p2[1])) / d,
                    p0[0], p0[1]
                );
                ctx.drawImage(img, 0, 0);
            }
            ctx.restore();
        }

        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Affiche d'abord le flux vidéo brut en fond
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const positions = ctrack.getCurrentPosition();
            
            if (positions && positions.length > 0 && animalTexture) {
                // Fusion intelligente : on dessine une texture animale semi-transparente 
                // enveloppée selon les contours exacts du visage tracké
                const leftCheek = positions[1];
                const rightCheek = positions.length > 13 ? positions[13] : positions[11];
                const chin = positions[7];
                const forehead = positions[21];

                const faceWidth = Math.abs(rightCheek[0] - leftCheek[0]) * 1.8;
                const faceHeight = Math.abs(chin[1] - forehead[1]) * 1.6;
                const centerX = (leftCheek[0] + rightCheek[0]) / 2;
                const centerY = (chin[1] + forehead[1]) / 2;

                ctx.save();
                ctx.globalAlpha = 0.88; // Permet de fusionner les yeux/bouche humains avec la peau animale
                ctx.globalCompositeOperation = 'source-over';
                
                // Déformation dynamique de la texture globale sur la zone faciale
                ctx.drawImage(
                    animalTexture,
                    centerX - faceWidth / 2,
                    centerY - faceHeight / 2,
                    faceWidth,
                    faceHeight
                );
                ctx.restore();
            }

            requestAnimationFrame(renderLoop);
        }

        init();
    </script>
</body>
</html>
