<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EgoLens - Suite Analytique Clinique</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@3.21.0/dist/tf-core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@3.21.0/dist/tf-converter.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@3.21.0/dist/tf-backend-webgl.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection@0.0.3/dist/face-landmarks-detection.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">EGOLENS <span class="text-xs text-emerald-400">v16.08-CLINICAL</span></h1>
        <div class="flex gap-2">
            <button id="btn-play" class="bg-emerald-600 px-4 py-1 rounded">Démarrer</button>
            <button id="btn-stop" class="bg-rose-600 px-4 py-1 rounded" disabled>Arrêter</button>
        </div>
        <div id="system-status" class="text-xs font-mono text-amber-400">En pause</div>
    </header>

    <main class="p-4 grid grid-cols-1 gap-4">
        <section class="bg-slate-900 p-4 rounded-xl border border-slate-800">
            <video id="input-video" class="w-full h-auto rounded border border-slate-700" autoplay playsinline muted></video>
        </section>
        <section class="bg-slate-900 p-4 rounded-xl border border-slate-800">
            <p>Écart Labial : <span id="val-facs" class="font-bold">0.000</span></p>
            <p>Diagnostic IA : <span id="val-diag" class="text-amber-400 font-bold">En attente</span></p>
        </section>
    </main>

    <script>
        let isRunning = false;
        let isProcessing = false;
        let model = null;
        const videoElement = document.getElementById('input-video');
        const valFacsEl = document.getElementById('val-facs');
        const valDiagEl = document.getElementById('val-diag');

        async function initModel() {
            await tf.setBackend('webgl');
            model = await faceLandmarksDetection.load(
                faceLandmarksDetection.SupportedPackages.mediapipeFacemesh,
                { maxFaces: 1 }
            );
        }

        async function runAnalysis() {
            if (!isRunning || !model || isProcessing) return;
            isProcessing = true;

            try {
                const predictions = await model.estimateFaces({
                    input: videoElement,
                    returnTensors: false,
                    flipHorizontal: false
                });

                if (predictions && predictions.length > 0) {
                    const keypoints = predictions[0].scaledMesh;
                    valDiagEl.textContent = "Mesh Actif (468 pts) ✔";
                    valDiagEl.className = "text-emerald-400 font-bold";

                    const lipUpper = keypoints[13];
                    const lipLower = keypoints[14];
                    const eyeDist = Math.hypot(keypoints[33][0] - keypoints[263][0], keypoints[33][1] - keypoints[263][1]);
                    const lipDistance = Math.hypot(lipUpper[0] - lipLower[0], lipUpper[1] - lipLower[1]);
                    
                    const ratio = lipDistance / eyeDist;
                    valFacsEl.textContent = ratio.toFixed(3) + (ratio > 0.15 ? " (Ouverture active)" : " (Calme)");
                } else {
                    valDiagEl.textContent = "Visage non détecté...";
                    valDiagEl.className = "text-rose-400 font-bold";
                }
            } catch (err) {
                console.error(err);
            } finally {
                isProcessing = false;
            }
        }

        document.getElementById('btn-play').addEventListener('click', async () => {
            document.getElementById('system-status').textContent = "Initialisation...";
            await initModel();
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            videoElement.srcObject = stream;
            isRunning = true;
            document.getElementById('btn-play').disabled = true;
            document.getElementById('btn-stop').disabled = false;
            document.getElementById('system-status').textContent = "Pipeline Actif";
            setInterval(runAnalysis, 100);
        });

        document.getElementById('btn-stop').addEventListener('click', () => location.reload());
    </script>
</body>
</html>
