<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EgoLens v8.5 - Full-Biometric + Alerts & Report</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

<div id="main-container" class="w-full max-w-5xl bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl overflow-hidden p-6 transition-colors duration-300">
    <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
        <div>
            <h1 class="text-2xl font-bold tracking-wider text-accent">EGOLENS <span class="text-xs font-normal text-gray-400">v8.5 Smart-Alert</span></h1>
            <p class="text-xs text-gray-400">Vision + Audio + rPPG + LSTM + Monitoring</p>
        </div>
        <div id="status" class="px-3 py-1 bg-red-500/20 text-red-400 border border-red-500/30 rounded-full text-xs font-medium">Système Arrêté</div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="md:col-span-2 relative bg-black rounded-xl overflow-hidden aspect-video flex items-center justify-center border border-gray-800">
            <video id="webcam" class="absolute inset-0 w-full h-full object-cover transform -scale-x-100" autoplay playsinline></video>
            <canvas id="output_canvas" class="absolute inset-0 w-full h-full object-cover transform -scale-x-100"></canvas>
        </div>

        <div class="flex flex-col justify-between space-y-4">
            <div class="bg-gray-950 p-4 rounded-xl border border-gray-800 space-y-3 font-mono text-xs">
                <div>
                    <span class="text-gray-400 uppercase text-[10px] block">État Émotionnel</span>
                    <span id="emotion-label" class="text-lg font-bold text-emerald-400 italic">En attente...</span>
                </div>
                <div class="flex justify-between border-t border-gray-800 pt-2"><span class="text-gray-400">Rythme (rPPG) :</span><span id="metric-hr" class="text-accent font-bold">-- BPM</span></div>
                <div class="flex justify-between"><span class="text-gray-400">Sourire (AU12) :</span><span id="metric-au12" class="text-accent">0.00</span></div>
                <div class="flex justify-between"><span class="text-gray-400">Surprise (AU5) :</span><span id="metric-au5" class="text-accent">0.00</span></div>
                <div class="flex justify-between"><span class="text-gray-400">Pupille :</span><span id="metric-pupil" class="text-accent">0.00</span></div>
                <div class="flex justify-between"><span class="text-gray-400">Tension Vocale :</span><span id="metric-audio" class="text-accent">0.00</span></div>
                <div class="flex justify-between"><span class="text-gray-400">Buffer LSTM :</span><span id="metric-buffer" class="text-accent">0 / 10</span></div>
            </div>
            <div class="bg-gray-950 p-4 rounded-xl border border-gray-800">
                <div class="flex justify-between items-center mb-2"><span class="text-xs font-semibold text-gray-300 uppercase tracking-wider">Facteur de Risque</span><span id="risk-value" class="text-lg font-bold text-accent">0%</span></div>
                <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden"><div id="risk-bar" class="bg-accent h-full transition-all duration-300" style="width: 0%"></div></div>
            </div>
        </div>
    </div>

    <div class="mt-6 flex justify-between items-center">
        <button onclick="switchCamera()" class="px-4 py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-200 font-medium rounded-xl text-xs transition border border-gray-700">🔄 Caméra</button>
        <button id="toggle-btn" onclick="toggleSystem()" class="px-6 py-2.5 bg-accent hover:bg-accent/80 text-white font-medium rounded-xl text-xs transition shadow-lg shadow-accent/20">Démarrer EgoLens</button>
    </div>
</div>

<!-- Modale de Compte Rendu Final -->
<div id="report-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl w-full max-w-md p-6 space-y-4">
        <h2 class="text-lg font-bold text-accent">Compte Rendu de Session</h2>
        <div id="report-content" class="space-y-2 text-xs font-mono text-gray-300">
            <!-- Injecté dynamiquement -->
        </div>
        <button onclick="closeReport()" class="w-full py-2.5 bg-gray-800 hover:bg-gray-700 text-white rounded-xl text-xs font-medium transition">Fermer</button>
    </div>
</div>

<script>
const videoElement = document.getElementById('webcam');
const canvasElement = document.getElementById('output_canvas');
const canvasCtx = canvasElement.getContext('2d');
const statusEl = document.getElementById('status');
const toggleBtn = document.getElementById('toggle-btn');
const mainContainer = document.getElementById('main-container');

let isRunning = false;
let currentFacingMode = 'user';
let videoStream, audioCtx, analyser, microphone, javascriptNode;
let vocalTension = 0.0;
let temporalBuffer = [];
const SEQUENCE_LENGTH = 10;
let mlModel, faceMesh;

// Variables de Monitoring pour le Rapport
let sessionStats = {
    startTime: null,
    riskValues: [],
    hrValues: [],
    peaksCount: 0
};

// Configuration Lissage (EMA)
const SMOOTHING = 0.2;
let smoothed = { au12: 0, au5: 0, pupil: 0, audio: 0, hr: 70 };
function smooth(val, target) { return val + (target - val) * SMOOTHING; }

let rppgBuffer = [];

faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

faceMesh.onResults((results) => {
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
    canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
    
    if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const l = results.multiFaceLandmarks[0];
        const faceWidth = Math.hypot(l[234].x - l[454].x, l[234].y - l[454].y);
        
        const rawPupil = (Math.hypot(l[159].y - l[145].y, l[159].x - l[145].x) / faceWidth) * 10;
        const rawSmile = Math.min(Math.max(((Math.hypot(l[61].x - l[291].x, l[61].y - l[291].y) / faceWidth) - 0.35) * 3, 0), 1);
        const rawSurprise = Math.min(Math.max((Math.hypot(l[13].y - l[14].y, l[13].x - l[14].x) / faceWidth) * 2, 0), 1);

        let rawHR = smoothed.hr;
        try {
            const x = Math.floor(l[10].x * canvasElement.width);
            const y = Math.floor(l[10].y * canvasElement.height);
            const frame = canvasCtx.getImageData(x - 15, y - 15, 30, 30);
            let redMean = 0;
            for (let i = 0; i < frame.data.length; i += 4) redMean += frame.data[i];
            redMean /= (frame.data.length / 4);
            
            rppgBuffer.push(redMean);
            if (rppgBuffer.length > 60) {
                rppgBuffer.shift();
                let peaks = 0;
                for (let i = 1; i < rppgBuffer.length - 1; i++) {
                    if (rppgBuffer[i] > rppgBuffer[i-1] && rppgBuffer[i] > rppgBuffer[i+1]) peaks++;
                }
                let estimated = peaks * 60;
                if (estimated > 45 && estimated < 160) rawHR = estimated;
            }
        } catch(e) {}

        smoothed.au12 = smooth(smoothed.au12, rawSmile);
        smoothed.au5 = smooth(smoothed.au5, rawSurprise);
        smoothed.pupil = smooth(smoothed.pupil, rawPupil);
        smoothed.audio = smooth(smoothed.audio, vocalTension);
        smoothed.hr = smooth(smoothed.hr, rawHR);

        document.getElementById('metric-au12').innerText = smoothed.au12.toFixed(3);
        document.getElementById('metric-au5').innerText = smoothed.au5.toFixed(3);
        document.getElementById('metric-pupil').innerText = smoothed.pupil.toFixed(3);
        document.getElementById('metric-audio').innerText = smoothed.audio.toFixed(2);
        document.getElementById('metric-hr').innerText = Math.round(smoothed.hr) + " BPM";

        let label = "Neutre";
        if (smoothed.au12 > 0.35) label = "Joyeux";
        else if (smoothed.au5 > 0.25) label = "Surpris / Alerte";
        document.getElementById('emotion-label').innerText = label;

        temporalBuffer.push([smoothed.au12, smoothed.au5, smoothed.hr / 150, smoothed.pupil, smoothed.audio]);
        if (temporalBuffer.length > SEQUENCE_LENGTH) temporalBuffer.shift();
        document.getElementById('metric-buffer').innerText = `${temporalBuffer.length} / ${SEQUENCE_LENGTH}`;

        if (temporalBuffer.length === SEQUENCE_LENGTH && mlModel) {
            const pred = mlModel.predict(tf.tensor3d([temporalBuffer]));
            const risk = Math.round(pred.dataSync()[0] * 100);
            
            document.getElementById('risk-value').innerText = risk + '%';
            document.getElementById('risk-bar').style.width = risk + '%';

            // Enregistrement pour les stats
            sessionStats.riskValues.push(risk);
            sessionStats.hrValues.push(Math.round(smoothed.hr));

            // Alerte Visuelle (Seuil Critique > 70%)
            if (risk > 70) {
                mainContainer.classList.add('border-red-500', 'shadow-red-500/20');
                sessionStats.peaksCount++;
            } else {
                mainContainer.classList.remove('border-red-500', 'shadow-red-500/20');
            }
        }
    }
});

async function initAudio() {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    microphone = audioCtx.createMediaStreamSource(stream);
    javascriptNode = audioCtx.createScriptProcessor(2048, 1, 1);
    analyser.fftSize = 1024;
    microphone.connect(analyser);
    analyser.connect(javascriptNode);
    javascriptNode.connect(audioCtx.destination);
    javascriptNode.onaudioprocess = () => {
        const array = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(array);
        let rms = Math.sqrt(array.reduce((a, b) => a + b * b, 0) / array.length);
        vocalTension = Math.min(rms / 50, 1.0);
    };
}

async function startSystem() {
    sessionStats = { startTime: Date.now(), riskValues: [], hrValues: [], peaksCount: 0 };
    mlModel = tf.sequential();
    mlModel.add(tf.layers.lstm({units: 16, inputShape: [SEQUENCE_LENGTH, 5]}));
    mlModel.add(tf.layers.dense({units: 1, activation: 'sigmoid'}));
    
    await initAudio();
    
    videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: false });
    videoElement.srcObject = videoStream;
    return new Promise(resolve => videoElement.onloadedmetadata = () => resolve());
}

async function loop() {
    if (!isRunning) return;
    if (videoElement.readyState >= 2) {
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;
        await faceMesh.send({ image: videoElement });
    }
    requestAnimationFrame(loop);
}

function showReport() {
    const duration = Math.round((Date.now() - sessionStats.startTime) / 1000);
    const avgRisk = sessionStats.riskValues.length ? Math.round(sessionStats.riskValues.reduce((a,b)=>a+b,0) / sessionStats.riskValues.length) : 0;
    const avgHr = sessionStats.hrValues.length ? Math.round(sessionStats.hrValues.reduce((a,b)=>a+b,0) / sessionStats.hrValues.length) : 0;

    document.getElementById('report-content').innerHTML = `
        <p>⏱️ Durée de la session : <strong>${duration} secondes</strong></p>
        <p>📈 Risque moyen : <strong>${avgRisk}%</strong></p>
        <p>❤️ Rythme cardiaque moyen : <strong>${avgHr} BPM</strong></p>
        <p>⚠️ Pics de stress (>70%) : <strong class="text-red-400">${sessionStats.peaksCount} alertes</strong></p>
    `;
    document.getElementById('report-modal').classList.remove('hidden');
    document.getElementById('report-modal').classList.add('flex');
}

function closeReport() {
    document.getElementById('report-modal').classList.remove('flex');
    document.getElementById('report-modal').classList.add('hidden');
}

async function toggleSystem() {
    if (!isRunning) {
        await startSystem();
        isRunning = true;
        statusEl.innerText = "Système Actif (Monitoring)";
        statusEl.className = "px-3 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full text-xs font-medium";
        toggleBtn.innerText = "Arrêter";
        loop();
    } else {
        isRunning = false;
        if (videoStream) videoStream.getTracks().forEach(t => t.stop());
        if (audioCtx) audioCtx.close();
        mainContainer.classList.remove('border-red-500', 'shadow-red-500/20');
        statusEl.innerText = "Système Arrêté";
        statusEl.className = "px-3 py-1 bg-red-500/20 text-red-400 border border-red-500/30 rounded-full text-xs font-medium";
        toggleBtn.innerText = "Démarrer EgoLens";
        
        if (sessionStats.riskValues.length > 0) showReport();
    }
}

async function switchCamera() {
    currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
    if (isRunning) await startSystem();
}
</script>
</body>
</html>
