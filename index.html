<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Cycle Ultime - Dr SMATI Moncef Amir</title>
    <style>
        :root {
            --primary: #9333ea;
            --primary-gradient: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            --bg-color: #fdf4ff;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #f3e8ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 440px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(147, 51, 234, 0.12);
            padding: 18px;
            border: 1px solid var(--border);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: var(--primary-gradient);
        }

        h1 {
            font-size: 1.15rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
            font-weight: 800;
        }

        .doctor-watermark {
            font-size: 0.6rem;
            color: #9333ea;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            background: #f3e8ff;
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
            text-align: left;
            background: #faf5ff;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #f3e8ff;
        }

        .input-group label {
            display: block;
            font-size: 0.68rem;
            font-weight: 700;
            margin-bottom: 2px;
            color: #7e22ce;
        }

        input[type="date"], select {
            width: 100%;
            padding: 5px 8px;
            border: 2px solid #e9d5ff;
            border-radius: 8px;
            font-size: 0.78rem;
            color: var(--text-main);
            background: #fff;
            outline: none;
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 180px;
            margin: 0 auto 8px auto;
            cursor: pointer;
        }

        canvas {
            width: 100%;
            height: auto;
            display: block;
        }

        .info-panel {
            background: #faf5ff;
            border-radius: 12px;
            padding: 10px;
            font-size: 0.7rem;
            color: var(--text-main);
            border: 1px solid #f3e8ff;
            text-align: left;
            margin-bottom: 8px;
        }

        .info-title {
            font-weight: 800;
            color: #7e22ce;
            margin-bottom: 3px;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
        }

        .badge {
            background: var(--primary-gradient);
            color: white;
            font-size: 0.55rem;
            padding: 1px 5px;
            border-radius: 4px;
            font-weight: 700;
        }

        /* Journal des symptômes */
        .section-box {
            background: #f8fafc;
            border-radius: 10px;
            padding: 8px;
            margin-bottom: 8px;
            border: 1px solid #e2e8f0;
            text-align: left;
        }

        .section-title {
            font-size: 0.68rem;
            font-weight: 700;
            color: #475569;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .symptom-grid {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .symptom-chip {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 3px 6px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.68rem;
            transition: all 0.2s;
        }
