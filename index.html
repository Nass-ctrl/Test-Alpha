<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morphing Visage Animal - Ultra Stable</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #111;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 640px;
            height: 480px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        video {
            display: none;
        }

        #controls {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        button {
            padding: 10px 18px;
            font-size: 15px;
            cursor: pointer;
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        button:hover {
            background-color: #d35400;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            color: #f1c40f;
            z-index: 20;
            font-weight: bold;
            background: rgba(0,0,0,0.85);
            padding: 20px 30px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div id="loading">Démarrage de la caméra...</div>
    
    <div class="container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" width="640" height="480"></canvas>
        
        <div id="controls">
            <button onclick="setAnimal('cat')">Chat</button>
            <button onclick="setAnimal('dog')">Chien</button>
            <button onclick="setAnimal('tiger')">Tigre</button>
            <button onclick="setAnimal('fox')">Renard</button>
        </div>
    </div>

    <!-- Chargement de clmtrackr (tracker de visage ultra-fiable) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/clmtrackr/1.1.2/clmtrackr.min.js"></script>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const loadingEl = document.getElementById('loading');

        let ctrack = new clm.tracker();
        let currentAnimal = 'cat';
        let animalTexture = null;

        const animalTextures = {
            cat: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=600&auto=format&fit=crop&q=60',
            dog: 'https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=600&auto=format&fit=crop&q=60',
            tiger: 'https://images.unsplash.com/photo-1534188753412-3e26d1d618d6?w=600&auto=format&fit=crop&q=60',
            fox: 'https://images.unsplash.com/photo-1516769136979-bf8c994ad51f?w=600&auto=format&fit=crop&q=60'
        };

        function setAnimal(type) {
            currentAnimal = type;
            loadTexture(animalTextures[type]);
        }

        function loadTexture(url) {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => { animalTexture = img; };
            img.src = url;
        }

        async function init() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480, facingMode: 'user' },
                    audio: false
                });
                video.srcObject = stream;
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve();
                    };
                });

                loadingEl.innerText = "Chargement du modèle facial...";
                ctrack.init();
                ctrack.start(video);

                loadTexture(animalTextures[currentAnimal]);
                loadingEl.style.display = 'none';
                renderLoop();
            } catch (err) {
                loadingEl.innerText = "Erreur : Impossible d'accéder à la caméra ou au modèle.";
                console.error(err);
            }
        }

        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const positions = ctrack.getCurrentPosition();
            if (positions && positions.length > 0 && animalTexture) {
                // Positions clés clmtrackr : 
                // 27 = œil gauche, 32 = œil droit, 62 = nez, 7 = menton, 20 = haut du front approx
                const leftEye = positions[27];
                const rightEye = positions[32];
                const nose = positions[62];
                const chin = positions[7];

                const width = Math.abs(rightEye[0] - leftEye[0]) * 3.5;
                const height = Math.abs(chin[1] - nose[1]) * 2.2;
                const centerX = nose[0];
                const centerY = nose[1] - (height * 0.25);

                ctx.save();
                ctx.globalAlpha = 0.88;
                ctx.drawImage(
                    animalTexture,
                    centerX - width / 2,
                    centerY - height / 2,
                    width,
                    height
                );
                ctx.restore();
            }

            requestAnimationFrame(renderLoop);
        }

        init();
    </script>
</body>
</html>
