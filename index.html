<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Effet de Transformation Animale</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #121212;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 640px;
            height: 480px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Effet miroir */
        }

        video {
            display: none;
        }

        #controls {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        button {
            padding: 10px 18px;
            font-size: 15px;
            cursor: pointer;
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        button:hover {
            background-color: #d35400;
        }

        #status {
            position: absolute;
            top: 20px;
            background: rgba(0,0,0,0.7);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 20;
            color: #f1c40f;
        }
    </style>
</head>
<body>

    <div id="status">Activation de la caméra...</div>
    
    <div class="container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" width="640" height="480"></canvas>
        
        <div id="controls">
            <button onclick="setFilter('tiger')">Tigre</button>
            <button onclick="setFilter('cat')">Chat</button>
            <button onclick="setFilter('alien')">Alien</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');

        let currentFilter = 'tiger';

        function setFilter(filterType) {
            currentFilter = filterType;
        }

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480, facingMode: 'user' },
                    audio: false
                });
                video.srcObject = stream;
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve();
                    };
                });
                statusEl.style.display = 'none';
                renderLoop();
            } catch (err) {
                statusEl.innerText = "Erreur : Accès caméra bloqué.";
                console.error(err);
            }
        }

        function renderLoop() {
            // Dessine la vidéo de base
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Récupère les pixels du canvas pour appliquer une transformation visuelle directe en temps réel
            const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = frame.data;

            // Application d'un traitement de style / filtre dynamique selon le choix
            for (let i = 0; i < data.length; i += 4) {
                let r = data[i];
                let g = data[i + 1];
                let b = data[i + 2];

                if (currentFilter === 'tiger') {
                    // Effet teintes fauves / orange contrasté (façon tigre)
                    data[i] = Math.min(255, r * 1.3);     // Plus de rouge
                    data[i + 1] = Math.min(255, g * 0.9); // Jaunissement
                    data[i + 2] = b * 0.4;                // Moins de bleu
                } else if (currentFilter === 'cat') {
                    // Effet chat (teinte douce lumineuse sépia/vert)
                    data[i] = Math.min(255, r * 1.1);
                    data[i + 1] = Math.min(255, g * 1.2);
                    data[i + 2] = b * 0.7;
                } else if (currentFilter === 'alien') {
                    // Effet transformation de couleur radicale (style créature)
                    data[i] = g;
                    data[i + 1] = r;
                    data[i + 2] = 255 - b;
                }
            }

            // Réécrit les pixels transformés
            ctx.putImageData(frame, 0, 0);

            // Ajout d'une surcouche graphique dynamique au centre (visage)
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            ctx.save();
            ctx.strokeStyle = currentFilter === 'tiger' ? '#e67e22' : (currentFilter === 'cat' ? '#f1c40f' : '#2ecc71');
            ctx.lineWidth = 4;
            ctx.beginPath();
            // Cercle englobant interactif de transformation faciale
            ctx.ellipse(centerX, centerY - 20, 110, 140, 0, 0, 2 * Math.PI);
            ctx.stroke();
            ctx.restore();

            requestAnimationFrame(renderLoop);
        }

        initCamera();
    </script>
</body>
</html>
