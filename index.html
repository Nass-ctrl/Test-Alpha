<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformation Animale en Direct</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #111;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 640px;
            height: 480px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Effet miroir */
        }

        video {
            display: none;
        }

        #controls {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        button {
            padding: 10px 18px;
            font-size: 15px;
            cursor: pointer;
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        button:hover {
            background-color: #d35400;
        }

        #status {
            position: absolute;
            top: 20px;
            background: rgba(0,0,0,0.8);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 20;
            color: #f1c40f;
        }
    </style>
</head>
<body>

    <div id="status">Démarrage...</div>
    
    <div class="container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" width="640" height="480"></canvas>
        
        <div id="controls">
            <button onclick="setAnimal('cat')">Chat</button>
            <button onclick="setAnimal('dog')">Chien</button>
            <button onclick="setAnimal('tiger')">Tigre</button>
            <button onclick="setAnimal('fox')">Renard</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');

        let currentAnimal = 'cat';
        let animalTexture = null;
        let faceDetector = null;

        const animalTextures = {
            cat: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=600&auto=format&fit=crop&q=60',
            dog: 'https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=600&auto=format&fit=crop&q=60',
            tiger: 'https://images.unsplash.com/photo-1534188753412-3e26d1d618d6?w=600&auto=format&fit=crop&q=60',
            fox: 'https://images.unsplash.com/photo-1516769136979-bf8c994ad51f?w=600&auto=format&fit=crop&q=60'
        };

        function setAnimal(type) {
            currentAnimal = type;
            loadTexture(animalTextures[type]);
        }

        function loadTexture(url) {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => { animalTexture = img; };
            img.src = url;
        }

        async function init() {
            try {
                // Vérifie si le navigateur supporte l'API de détection native
                if (!('FaceDetector' in window)) {
                    statusEl.innerText = "Mode compatible : Utilisation du positionnement dynamique.";
                } else {
                    faceDetector = new FaceDetector({ fastMode: true, maxDetectedFaces: 1 });
                    statusEl.style.display = 'none';
                }

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480, facingMode: 'user' },
                    audio: false
                });
                video.srcObject = stream;
                
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve();
                    };
                });

                loadTexture(animalTextures[currentAnimal]);
                statusEl.style.display = 'none';
                detectAndDraw();
            } catch (err) {
                statusEl.innerText = "Erreur d'accès à la caméra.";
                console.error(err);
            }
        }

        async function detectAndDraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            if (animalTexture) {
                let box = null;

                if (faceDetector) {
                    try {
                        const faces = await faceDetector.detect(video);
                        if (faces.length > 0) {
                            box = faces[0].boundingbox;
                        }
                    } catch (e) {
                        // Ignore si la frame échoue
                    }
                }

                // Si le visage est détecté nativement, on adapte la taille et la position
                if (box) {
                    const width = box.width * 1.4;
                    const height = box.height * 1.4;
                    const x = box.left - (width - box.width) / 2;
                    const y = box.top - (height - box.height) / 2;

                    ctx.save();
                    ctx.globalAlpha = 0.9;
                    ctx.drawImage(animalTexture, x, y, width, height);
                    ctx.restore();
                } else {
                    // Repli intelligent au centre si la détection cherche le visage
                    const width = 280;
                    const height = 210;
                    const x = (canvas.width - width) / 2;
                    const y = (canvas.height - height) / 2 - 15;

                    ctx.save();
                    ctx.globalAlpha = 0.8;
                    ctx.drawImage(animalTexture, x, y, width, height);
                    ctx.restore();
                }
            }

            requestAnimationFrame(detectAndDraw);
        }

        init();
    </script>
</body>
</html>
