<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morphing Animal Morphologique</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 640px;
            height: 480px;
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Effet miroir */
        }

        video {
            display: none; /* Cache la vidéo brute, tout se fait sur le canvas */
        }

        #controls {
            position: absolute;
            bottom: -60px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }

        button:hover {
            background-color: #d35400;
        }

        #loading {
            position: absolute;
            font-size: 20px;
            color: #f1c40f;
        }
    </style>
</head>
<body>

    <div id="loading">Chargement des modèles de morphing...</div>
    
    <div class="container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" width="640" height="480"></canvas>
        
        <div id="controls">
            <button onclick="setAnimal('cat')">Chat</button>
            <button onclick="setAnimal('dog')">Chien</button>
            <button onclick="setAnimal('tiger')">Tigre</button>
            <button onclick="setAnimal('fox')">Renard</button>
        </div>
    </div>

    <!-- TensorFlow.js et Face Landmarks Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.2.0/dist/tf-core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.2.0/dist/tf-converter.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.2.0/dist/tf-backend-webgl.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection@1.0.2/dist/face-landmarks-detection.min.js"></script>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const loadingEl = document.getElementById('loading');

        let detector;
        let currentAnimal = 'cat';
        let animalTexture = null;

        // URLs d'images de textures animales (visages complets/fourrure transparente)
        const animalTextures = {
            cat: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=600&auto=format&fit=crop&q=60',
            dog: 'https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=600&auto=format&fit=crop&q=60',
            tiger: 'https://images.unsplash.com/photo-1534188753412-3e26d1d618d6?w=600&auto=format&fit=crop&q=60',
            fox: 'https://images.unsplash.com/photo-1516769136979-bf8c994ad51f?w=600&auto=format&fit=crop&q=60'
        };

        function setAnimal(type) {
            currentAnimal = type;
            loadTexture(animalTextures[type]);
        }

        function loadTexture(url) {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => {
                animalTexture = img;
            };
            img.src = url;
        }

        async function initCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: 640, height: 480, facingMode: 'user' },
                audio: false
            });
            video.srcObject = stream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    video.play();
                    resolve();
                };
            });
        }

        async function initModel() {
            const model = faceDetection.SupportedModels.MediaPipeFaceMesh;
            const detectorConfig = {
                runtime: 'tfjs',
                refineLandmarks: true,
                maxFaces: 1
            };
            detector = await faceDetection.createDetector(model, detectorConfig);
            loadingEl.style.display = 'none';
        }

        // Triangulation simplifiée pour déformer les zones du visage (Mesh mapping)
        function drawMorphingFace(keypoints) {
            if (!animalTexture) return;

            // Repères clés du visage (Yeux, Nez, Mâchoire, Front)
            const leftEye = keypoints[33];
            const rightEye = keypoints[263];
            const noseTip = keypoints[1];
            const chin = keypoints[152];
            const forehead = keypoints[10];

            // Calculer la boîte englobante morphologique du visage détecté
            const width = Math.abs(rightEye.x - leftEye.x) * 3.2;
            const height = Math.abs(chin.y - forehead.y) * 1.3;
            const centerX = noseTip.x;
            const centerY = (noseTip.y + forehead.y) / 2;

            ctx.save();
            // Effet de fusion/transparence pour épouser les traits humains sous la texture animale
            ctx.globalAlpha = 0.85;
            ctx.globalCompositeOperation = 'source-over';

            // Déformation de la texture animale selon les coordonnées faciales dynamiques
            ctx.drawImage(
                animalTexture,
                centerX - width / 2,
                centerY - height / 2,
                width,
                height
            );

            ctx.restore();
        }

        async function renderLoop() {
            // Dessiner le flux vidéo de base en arrière-plan
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            if (detector) {
                const faces = await detector.estimateFaces(video, { flipHorizontal: false });
                if (faces.length > 0) {
                    drawMorphingFace(faces[0].keypoints);
                }
            }

            requestAnimationFrame(renderLoop);
        }

        async function main() {
            await initCamera();
            await initModel();
            loadTexture(animalTextures[currentAnimal]);
            renderLoop();
        }

        main();
    </script>
</body>
</html>
