<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>EgoLens - Analyse Micro/Macro-Expressions Expert</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@3.21.0/dist/tf-core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@3.21.0/dist/tf-converter.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@3.21.0/dist/tf-backend-webgl.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection@0.0.3/dist/face-landmarks-detection.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- Header simplifié -->
    <header class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900">
        <h1 class="font-bold text-emerald-400">EGOLENS <span class="text-slate-400 font-normal">v16.09 | MICRO-MACRO DUAL ENGINE</span></h1>
        <div class="flex gap-2">
            <button id="btn-play" class="bg-emerald-600 px-4 py-1 rounded text-sm">Démarrer</button>
        </div>
    </header>

    <main class="p-4 grid grid-cols-1 lg:grid-cols-2 gap-6">
        <section class="relative w-full aspect-video rounded-xl overflow-hidden border border-slate-700 bg-black">
            <video id="input-video" class="absolute inset-0 w-full h-full object-cover" autoplay playsinline muted></video>
            <canvas id="output-canvas" class="absolute inset-0 w-full h-full"></canvas>
        </section>

        <section class="flex flex-col gap-4">
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                    <p class="text-[10px] uppercase text-slate-400">Micro-Expression (Instantané)</p>
                    <div id="val-micro" class="text-xl font-bold text-rose-400">-</div>
                </div>
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                    <p class="text-[10px] uppercase text-slate-400">Macro-Tendance (Fond)</p>
                    <div id="val-macro" class="text-xl font-bold text-cyan-400">-</div>
                </div>
            </div>
            <div id="final-report" class="h-64 overflow-y-auto bg-slate-900 p-4 rounded-xl border border-slate-800 text-xs font-mono"></div>
        </section>
    </main>

    <script>
        let model, isRunning = false, historyBuffer = [];
        const video = document.getElementById('input-video');
        const canvas = document.getElementById('output-canvas');
        const ctx = canvas.getContext('2d');

        async function init() {
            model = await faceLandmarksDetection.load(faceLandmarksDetection.SupportedPackages.mediapipeFacemesh);
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            isRunning = true;
            analyze();
        }

        function analyze() {
            if (!isRunning) return;
            model.estimateFaces({ input: video }).then(preds => {
                if (preds.length > 0) {
                    const mesh = preds[0].scaledMesh;
                    draw(mesh);
                    processEmotions(mesh);
                }
                requestAnimationFrame(analyze);
            });
        }

        function draw(mesh) {
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#10b981";
            mesh.forEach(p => ctx.fillRect(p[0], p[1], 1.5, 1.5));
        }

        function processEmotions(mesh) {
            // Extraction métrique simplifiée
            const mouthOpen = Math.abs(mesh[13][1] - mesh[14][1]);
            const browDist = Math.abs(mesh[70][0] - mesh[300][0]);
            
            // Gestion du buffer pour Macro vs Micro
            historyBuffer.push({ mouthOpen, browDist });
            if (historyBuffer.length > 20) historyBuffer.shift();

            // Calcul Macro (Moyenne sur 20 frames)
            const macroMouth = historyBuffer.reduce((a, b) => a + b.mouthOpen, 0) / historyBuffer.length;
            
            // Détection Micro (Différence frame actuelle vs Moyenne précédente)
            const isMicro = Math.abs(mouthOpen - macroMouth) > 15; // Seuil de saut brusque

            document.getElementById('val-micro').textContent = isMicro ? "ALERTE MICRO" : "Stabilité";
            document.getElementById('val-macro').textContent = macroMouth > 30 ? "Ouverture" : "Repos";

            if (isMicro) {
                const p = document.createElement('p');
                p.className = "text-rose-400";
                p.textContent = `[${new Date().toLocaleTimeString()}] Micro-variation détectée (AU25/Surprise)`;
                document.getElementById('final-report').prepend(p);
            }
        }

        document.getElementById('btn-play').addEventListener('click', init);
    </script>
</body>
</html>
